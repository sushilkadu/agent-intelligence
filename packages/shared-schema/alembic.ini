[alembic]
script_location = alembic
prepend_sys_path = .

# No hardcoded sqlalchemy.url here -- alembic/env.py reads DATABASE_URL
# from the environment instead (see env.py), so the same migration
# config works against local docker-compose Postgres, CI, and (in a
# later phase) real RDS, without editing this file per environment.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
