[project]
name = "shared-schema"
version = "0.1.0"
description = "Canonical Pydantic schema shared across all Agent Intelligence Python services"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.6,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared_schema*"]
